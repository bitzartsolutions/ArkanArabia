  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .shadow-premium {
      box-shadow: 0 40px 60px -20px rgba(27, 74, 159, 0.08);
    }
    .blue-glow { box-shadow: 0 0 40px 0 rgba(27, 74, 159, 0.04); }
    .gradient-bg { background: linear-gradient(135deg, #00337d 0%, #1b4a9f 100%); }
    .transition-standard { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    /* Scroll reveal — desktop */
    .ind-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .ind-reveal.visible { opacity: 1; transform: translateY(0); }
    /* Scroll reveal — mobile */
    .mob-ind-reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .mob-ind-reveal.visible { opacity: 1; transform: translateY(0); }
    /* Side drawer */
    #ind-drawer {
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #ind-drawer.open { transform: translateX(0); }
    #ind-overlay { display: none; }
    #ind-overlay.open { display: block; }
    /* Native <details> FAQ chevron */
    details summary::-webkit-details-marker { display: none; }
    details[open] summary .faq-chevron { transform: rotate(180deg); }
    .faq-chevron { transition: transform 0.3s ease; }
    /* Mobile FAQ accordion */
    .mob-accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }
    .mob-accordion-item.open .mob-accordion-content { max-height: 300px; }
    .mob-accordion-item.open .mob-acc-chevron { transform: rotate(180deg); }
    .mob-acc-chevron { transition: transform 0.3s ease; }
  </style>
  <link rel="stylesheet" href="../assets/css/styles.css"/>

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-white overflow-x-hidden">

  <!-- ═══════════════════════════════════════════════════════
       MOBILE LAYOUT  (md:hidden)
  ═══════════════════════════════════════════════════════ -->

  <!-- ══ MOBILE HEADER + DRAWER (injected, md:hidden) ══ -->
  <div id="mob-header"></div>

  <!-- Mobile Main Content -->
  <div id="industries-mobile-content"></div><!-- /md:hidden main -->

  <!-- ══ MOBILE BOTTOM NAV (injected, md:hidden) ══ -->
  <div id="mob-nav"></div>

  <!-- ═══════════════════════════════════════════════════════
       DESKTOP LAYOUT  (hidden md:block)
  ═══════════════════════════════════════════════════════ -->

  <div id="site-header" class="hidden md:block"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SECTIONS (md+ only) — loaded from desktop/industries.html
       ══════════════════════════════════════════════════════ -->
  <div id="industries-desktop-content"></div>

  <div id="site-footer" class="hidden md:block"></div>

  <script src="../assets/js/script.js"></script>
  <script>
    (async () => {
      // Load the Industries page's desktop/mobile content partials from the
      // shared desktop/ and mobile/ folders so each layout can be edited
      // independently without touching the other.
      await Promise.all([
        loadComponent('#industries-mobile-content', rootPath() + 'mobile/industries.html'),
        loadComponent('#industries-desktop-content', rootPath() + 'desktop/industries.html'),
      ]);

      // ── Mobile scroll reveal (mob-ind-reveal) ──
      const mobIndObs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            mobIndObs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.mob-ind-reveal').forEach(el => mobIndObs.observe(el));

      // ── Desktop scroll reveal (ind-reveal) ──
      const indObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            indObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.ind-reveal').forEach(el => indObserver.observe(el));
    })();

    // ── Sticky header scroll shadow ──
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.md\\:hidden');
      if (header) {
        if (window.scrollY > 50) { header.classList.add('shadow-md'); }
        else { header.classList.remove('shadow-md'); }
      }
    });
  </script>
</body>
