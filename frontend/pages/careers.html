  <script>
    const API_BASE_URL = window.ARKAN_API_BASE_URL;
    const API_CAREERS = `${API_BASE_URL}/api/careers`;

    let allJobs = [];
    let toastTimer = null;

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Renders **bold** and *italic* markers written from the admin panel's formatting toolbar.
    function formatInlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    // Lines starting with "- " (added via the admin panel's bullet toggle) render as list items;
    // other lines render as plain paragraphs. If no line uses "- ", every line bullets (legacy behavior).
    function renderRequirements(text) {
      const lines = String(text || '').split('\n').filter(l => l.trim());
      if (!lines.length) return '';
      const hasExplicitBullets = lines.some(l => l.trim().startsWith('- '));

      if (!hasExplicitBullets) {
        return `<ul class="list-disc pl-5 space-y-1">${lines.map(l => `<li>${formatInlineMarkdown(l)}</li>`).join('')}</ul>`;
      }

      let html = '';
      let ulOpen = false;
      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('- ')) {
          if (!ulOpen) { html += '<ul class="list-disc pl-5 space-y-1">'; ulOpen = true; }
          html += `<li>${formatInlineMarkdown(trimmed.slice(2))}</li>`;
        } else {
          if (ulOpen) { html += '</ul>'; ulOpen = false; }
          html += `<p class="mb-1">${formatInlineMarkdown(trimmed)}</p>`;
        }
      });
      if (ulOpen) html += '</ul>';
      return html;
    }

    async function loadJobs() {
      try {
        const res = await fetch(API_CAREERS);
        if (!res.ok) throw new Error('Failed to load jobs');
        const data = await res.json();
        allJobs = Array.isArray(data) ? data : [];
      } catch (e) {
        allJobs = [];
        showToast('Could not load job postings.', 'error');
      }
    }

    function showToast(msg, icon) {
      const toast = document.getElementById('career-toast');
      document.getElementById('career-toast-msg').textContent = msg;
      document.getElementById('career-toast-icon').textContent = icon || 'check_circle';
      toast.classList.remove('hidden');
      requestAnimationFrame(() => toast.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.classList.add('hidden'), 400);
      }, 3500);
    }

    function isJobExpired(job) {
      if (!job.deadline) return false;
      return new Date(job.deadline) < new Date(new Date().toDateString());
    }

    // Jobs stay visible (but inactive) once the deadline passes, then drop off
    // the careers page entirely 24 hours after that.
    function isJobHidden(job) {
      if (!job.deadline) return false;
      const hideThreshold = new Date(job.deadline);
      hideThreshold.setDate(hideThreshold.getDate() + 1);
      hideThreshold.setTime(hideThreshold.getTime() + 24 * 60 * 60 * 1000);
      return new Date() >= hideThreshold;
    }

    function formatDeadline(deadline) {
      try {
        return new Date(deadline).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch {
        return deadline;
      }
    }

    function jobCardHtml(job) {
      const expired = isJobExpired(job);
      return `
        <div class="job-card bg-white rounded-2xl shadow-sm border border-outline-variant/20 overflow-hidden cursor-pointer group flex flex-col p-lg" onclick="location.href='/careers?job=${encodeURIComponent(job.id)}'">
          <div class="flex items-center justify-between mb-sm">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary w-fit">${escapeHtml(job.employmentType)}</span>
            ${expired ? '<span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-error-container text-on-error-container w-fit">Closed</span>' : ''}
          </div>
          <h3 class="font-h3 text-[20px] font-bold text-on-surface mb-xs">${escapeHtml(job.title)}</h3>
          <div class="flex flex-wrap items-center gap-md text-sm text-on-surface-variant mb-md">
            <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">business_center</span>${escapeHtml(job.department)}</span>
            <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">location_on</span>${escapeHtml(job.location)}</span>
          </div>
          ${job.deadline ? `<div class="flex items-center gap-xs text-sm ${expired ? 'text-error' : 'text-on-surface-variant'} mb-md"><span class="material-symbols-outlined text-[16px]">event_busy</span>${expired ? 'Closed on' : 'Apply by'} ${formatDeadline(job.deadline)}</div>` : ''}
          <p class="text-sm text-on-surface-variant line-clamp-3 mb-md flex-grow">${escapeHtml(job.description)}</p>
          <div class="flex gap-sm mt-auto pt-md border-t border-outline-variant/20">
            <button type="button" ${expired ? 'disabled' : `onclick="event.stopPropagation(); openApplyModal('${job.id}')"`} class="flex-1 h-11 font-semibold rounded-xl text-sm transition-colors ${expired ? 'bg-surface-container text-on-surface-variant cursor-not-allowed' : 'bg-primary text-on-primary hover:bg-primary-container'}">${expired ? 'Applications Closed' : 'Apply Now'}</button>
            <button type="button" data-share-trigger onclick="event.stopPropagation(); shareJob('${job.id}', event)" aria-label="Share this job" class="w-11 h-11 rounded-xl border border-outline-variant flex items-center justify-center hover:bg-surface-container-low transition-colors">
              <span class="material-symbols-outlined text-[18px]">share</span>
            </button>
          </div>
        </div>`;
    }

    function renderJobGrid() {
      const deskGrid = document.getElementById('desk-job-grid');
      const mobGrid = document.getElementById('mob-job-grid');
      const deskEmpty = document.getElementById('desk-job-empty');
      const mobEmpty = document.getElementById('mob-job-empty');
      const visibleJobs = allJobs.filter(job => !isJobHidden(job));
      const html = visibleJobs.map(jobCardHtml).join('');

      if (deskGrid) deskGrid.innerHTML = html;
      if (mobGrid) mobGrid.innerHTML = html;
      if (deskEmpty) deskEmpty.classList.toggle('hidden', visibleJobs.length > 0);
      if (mobEmpty) mobEmpty.classList.toggle('hidden', visibleJobs.length > 0);
    }

    let shareMenuUrl = '';
    let shareMenuText = '';

    function shareJob(id, event) {
      const job = allJobs.find(j => j.id === id);
      if (!job) return;
      if (event) event.stopPropagation();

      shareMenuUrl = `${window.location.origin}/careers?job=${encodeURIComponent(id)}`;
      shareMenuText = `Job opening: ${job.title} at Arkan Arabia Logistics`;

      const menu = document.getElementById('share-menu');
      const btn = event ? event.currentTarget : null;

      if (btn) {
        const rect = btn.getBoundingClientRect();
        const menuWidth = 224;
        let left = rect.right - menuWidth;
        left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8));
        menu.style.left = `${left}px`;
        menu.style.top = `${rect.bottom + 8}px`;
      }

      menu.classList.remove('hidden');
    }

    function closeShareMenu() {
      document.getElementById('share-menu').classList.add('hidden');
    }

    function shareVia(platform) {
      const url = shareMenuUrl;
      const text = shareMenuText;
      closeShareMenu();

      if (platform === 'whatsapp') {
        window.open(`https://wa.me/?text=${encodeURIComponent(`${text} ${url}`)}`, '_blank', 'noopener');
        return;
      }
      if (platform === 'linkedin') {
        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank', 'noopener');
        return;
      }
      if (platform === 'instagram') {
        navigator.clipboard.writeText(url).then(() => {
          showToast('Link copied — paste it in your Instagram bio or story.', 'photo_camera');
        }).catch(() => {
          showToast('Copy this link to share on Instagram.', 'photo_camera');
        });
        return;
      }
      // copy
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied to clipboard!', 'content_copy');
      }).catch(() => {
        showToast('Share this page URL.', 'share');
      });
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('share-menu');
      if (menu.classList.contains('hidden')) return;
      if (menu.contains(e.target) || e.target.closest('[data-share-trigger]')) return;
      closeShareMenu();
    });

    function openApplyModal(id) {
      const job = allJobs.find(j => j.id === id);
      if (!job) return;
      if (isJobExpired(job)) {
        showToast('Applications for this position are closed.', 'event_busy');
        return;
      }
      document.getElementById('apply-form').reset();
      document.getElementById('apply-job-id').value = id;
      document.getElementById('apply-job-title').textContent = `${job.title} — ${job.department}`;
      document.getElementById('apply-error').classList.add('hidden');
      document.getElementById('apply-modal').classList.remove('hidden');
      document.body.classList.add('modal-open');
    }

    function closeApplyModal() {
      document.getElementById('apply-modal').classList.add('hidden');
      document.body.classList.remove('modal-open');
    }

    document.getElementById('apply-modal').addEventListener('click', function (e) {
      if (e.target === this) closeApplyModal();
    });

    async function submitApplication(e) {
      e.preventDefault();
      const jobId = document.getElementById('apply-job-id').value;
      const fullName = document.getElementById('apply-full-name').value.trim();
      const email = document.getElementById('apply-email').value.trim();
      const phone = document.getElementById('apply-phone').value.trim();
      const linkedIn = document.getElementById('apply-linkedin').value.trim();
      const coverLetter = document.getElementById('apply-cover-letter').value.trim();
      const resumeFile = document.getElementById('apply-resume').files[0];
      const errorEl = document.getElementById('apply-error');

      if (!fullName || !email) {
        errorEl.textContent = 'Full name and email are required.';
        errorEl.classList.remove('hidden');
        return;
      }
      if (!resumeFile) {
        errorEl.textContent = 'Please attach your resume.';
        errorEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('apply-submit-btn');
      const label = document.getElementById('apply-submit-label');
      const originalLabel = label.textContent;
      btn.disabled = true;
      label.textContent = 'Submitting...';
      errorEl.classList.add('hidden');

      try {
        const formData = new FormData();
        formData.append('fullName', fullName);
        formData.append('email', email);
        formData.append('phone', phone);
        formData.append('linkedIn', linkedIn);
        formData.append('coverLetter', coverLetter);
        formData.append('resume', resumeFile);

        const res = await fetch(`${API_CAREERS}/${jobId}/apply`, {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Could not submit application. Please try again.';
          errorEl.classList.remove('hidden');
          return;
        }

        closeApplyModal();
        showToast('Application submitted successfully!', 'check_circle');
      } catch (err) {
        errorEl.textContent = 'Could not submit application. Check your connection.';
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        label.textContent = originalLabel;
      }
    }

    function showJobDetail(id) {
      const container = document.getElementById('job-detail-content');
      const job = allJobs.find(j => j.id === id);

      if (!job || isJobHidden(job)) {
        document.title = 'Job Not Found | Arkan Arabia Logistics';
        container.innerHTML = `
          <div class="p-xl text-center">
            <span class="material-symbols-outlined text-6xl text-on-surface-variant mb-md block">search_off</span>
            <h1 class="font-h2 text-h2 text-on-surface mb-sm">Job Not Found</h1>
            <p class="text-on-surface-variant mb-lg">This position may no longer be available.</p>
            <a href="/careers" class="inline-flex items-center gap-sm px-lg py-sm bg-primary text-on-primary font-label-sm text-label-sm rounded-xl hover:bg-primary-container transition-colors">
              <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Careers
            </a>
          </div>`;
        return;
      }

      document.title = `${job.title} | Arkan Arabia Logistics`;

      const descHtml = job.description
        ? job.description.split('\n').filter(l => l.trim()).map(line => `<p>${escapeHtml(line)}</p>`).join('')
        : '<p class="text-on-surface-variant italic">No description available.</p>';

      const reqHtml = renderRequirements(job.requirements);

      const expired = isJobExpired(job);
      const applyBtnClass = expired
        ? 'bg-surface-container text-on-surface-variant cursor-not-allowed'
        : 'bg-primary text-on-primary hover:bg-primary-container';
      const applyBtnAttrs = expired ? 'disabled' : `onclick="openApplyModal('${job.id}')"`;
      const applyLabel = expired ? 'Applications Closed' : 'Apply Now';

      container.innerHTML = `
        <div class="bg-gradient-to-br from-primary to-primary-container text-white p-lg md:p-xl">
          <div class="flex items-center gap-sm mb-md">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-white/20 w-fit">${escapeHtml(job.employmentType)}</span>
            ${expired ? '<span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-error-container text-on-error-container w-fit">Closed</span>' : ''}
          </div>
          <h1 class="font-h2 text-h2 mb-md leading-tight">${escapeHtml(job.title)}</h1>
          <div class="flex flex-wrap items-center gap-md text-white/80 text-sm">
            <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">business_center</span>${escapeHtml(job.department)}</span>
            <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">location_on</span>${escapeHtml(job.location)}</span>
            <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">calendar_month</span>Posted ${escapeHtml(job.postedDate || '')}</span>
            ${job.deadline ? `<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">event_busy</span>${expired ? 'Closed on' : 'Apply by'} ${formatDeadline(job.deadline)}</span>` : ''}
          </div>
        </div>
        <div class="p-md md:p-lg">
          <div class="flex flex-wrap gap-sm mb-lg">
            <button type="button" ${applyBtnAttrs} class="flex items-center gap-sm px-lg py-sm font-label-sm text-label-sm rounded-xl transition-colors ${applyBtnClass}">
              <span class="material-symbols-outlined text-[18px]">send</span> ${applyLabel}
            </button>
            <button type="button" data-share-trigger onclick="shareJob('${job.id}', event)" class="flex items-center gap-sm px-md py-sm bg-surface-container text-on-surface font-label-sm text-label-sm rounded-xl hover:bg-surface-container-high transition-colors border border-outline-variant/30">
              <span class="material-symbols-outlined text-[18px]">share</span> Share
            </button>
          </div>
          <h2 class="font-h3 text-h3 text-on-surface mb-sm">Job Description</h2>
          <div class="blog-prose mb-lg">${descHtml}</div>
          ${job.requirements ? `<h2 class="font-h3 text-h3 text-on-surface mb-sm">Requirements</h2><div class="text-on-surface-variant leading-relaxed mb-lg">${reqHtml}</div>` : ''}
          <div class="pt-md border-t border-outline-variant/30">
            <button type="button" ${applyBtnAttrs} class="w-full md:w-auto flex items-center justify-center gap-sm px-lg py-sm font-label-sm text-label-sm rounded-xl transition-colors ${applyBtnClass}">
              <span class="material-symbols-outlined text-[18px]">send</span> ${expired ? 'Applications Closed' : 'Apply for this Position'}
            </button>
          </div>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const jobId = new URLSearchParams(location.search).get('job');

      // A ?job= param means someone followed a direct link to a single posting —
      // show that as its own page instead of the listing, skipping the listing
      // partials entirely since nothing in them is needed here.
      if (jobId) {
        document.getElementById('job-detail-view').classList.remove('hidden');
        await loadJobs();
        showJobDetail(jobId);
        return;
      }

      await Promise.all([
        loadComponent('#careers-mobile-content', rootPath() + 'mobile/careers.html'),
        loadComponent('#careers-desktop-content', rootPath() + 'desktop/careers.html'),
      ]);

      await loadJobs();
      renderJobGrid();
    });
  </script>
</body>
</html>
