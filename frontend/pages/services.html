  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .hero-gradient-overlay {
      background: linear-gradient(to bottom, rgba(0, 51, 125, 0.4), rgba(0, 51, 125, 0.8));
    }
    .blue-gradient {
      background: linear-gradient(135deg, #00337d 0%, #1b4a9f 100%);
    }
    /* Accordion */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    .accordion-active .accordion-content {
      max-height: 300px;
    }
    .accordion-active .icon-rotate {
      transform: rotate(180deg);
    }
    /* Desktop FAQ */
    .faq-answer { display: none; margin-top: 16px; }
    .faq-item.open .faq-answer { display: block; }
    .faq-item.open .faq-icon { transform: rotate(180deg); }
    .faq-icon { transition: transform 0.3s ease; }
    /* Core services grid: 3 cards per row on desktop */
    .core-service-card {
      width: 100%;
    }
    @media (min-width: 768px) {
      .core-service-card { width: calc((100% - 24px) / 2); }
    }
    @media (min-width: 1024px) {
      .core-service-card { width: calc((100% - 48px) / 3); }
    }
    /* Industries Supported grid: 3 cards per row on desktop (gap-6 = 24px) */
    .industry-card { width: 100%; }
    @media (min-width: 768px) {
      .industry-card { width: calc((100% - 48px) / 3); }
    }
    /* Reveal */
    .srv-reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .srv-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Mobile reveal */
    .mob-reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .mob-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Side drawer */
    #srv-drawer { transform: translateX(-100%); transition: transform 0.3s ease; }
    #srv-drawer.open { transform: translateX(0); }
    #srv-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #srv-overlay.open { opacity: 1; pointer-events: auto; }
    /* Scrollbar hide */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    /* Timeline connector */
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
</head>

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">

  <!-- ══════════════════════════════════════════════════════
       MOBILE TOP APP BAR (< md only)
       ══════════════════════════════════════════════════════ -->
  <!-- ══ MOBILE HEADER + DRAWER (injected, md:hidden) ══ -->
  <div id="mob-header"></div>

  <!-- ══════════════════════════════════════════════════════
       MOBILE MAIN CONTENT (< md only)
       ══════════════════════════════════════════════════════ -->
  <div id="services-mobile-content"></div>
  <!-- END MOBILE MAIN -->

  <!-- ══ MOBILE BOTTOM NAV (injected, md:hidden) ══ -->
  <div id="mob-nav"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SHARED HEADER (injected, md+ only)
       ══════════════════════════════════════════════════════ -->
  <div id="site-header" class="hidden md:block"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SECTIONS (md+ only) — loaded from desktop/services.html
       ══════════════════════════════════════════════════════ -->
  <div id="services-desktop-content"></div>

  <!-- DESKTOP SHARED FOOTER (injected) -->
  <div id="site-footer" class="hidden md:block"></div>

  <!-- Scripts -->
  <script src="../assets/js/script.js"></script>
  <script>
    (async () => {
      // Load the Services page's desktop/mobile content partials from the
      // shared desktop/ and mobile/ folders so each layout can be edited
      // independently without touching the other.
      await Promise.all([
        loadComponent('#services-mobile-content', rootPath() + 'mobile/services.html'),
        loadComponent('#services-desktop-content', rootPath() + 'desktop/services.html'),
      ]);

      // ── Mobile scroll-reveal ──
      const mobObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); mobObs.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.mob-reveal').forEach(el => mobObs.observe(el));

      // ── Desktop FAQ ──
      document.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-trigger').addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
          if (!isOpen) item.classList.add('open');
        });
      });

      // ── Desktop srv-reveal ──
      const srvObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); srvObs.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.srv-reveal').forEach(el => srvObs.observe(el));
    })();

    // ── Mobile header scroll ──
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.md\\:hidden');
      if (!header) return;
      if (window.scrollY > 50) {
        header.classList.add('shadow-md');
      } else {
        header.classList.remove('shadow-md');
      }
    });
  </script>
</body>
</html>
