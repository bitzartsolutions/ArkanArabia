  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    /* Desktop styles */
    .text-gradient {
      background: linear-gradient(135deg, #00337d 0%, #1b4a9f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .timeline-line::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #b0c6ff 20%, #b0c6ff 80%, transparent);
      transform: translateY(-50%);
      z-index: 0;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Mobile styles */
    .hero-gradient-mobile {
      background: linear-gradient(180deg, rgba(0, 51, 125, 0.4) 0%, rgba(0, 51, 125, 0.8) 100%);
    }
    .text-shadow-sm { text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    /* Scroll reveal */
    .abt-reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .abt-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">

  <!-- ══ MOBILE HEADER + DRAWER (injected, md:hidden) ══ -->
  <div id="mob-header"></div>

  <!-- Desktop shared header (hidden on mobile) -->
  <div id="site-header" class="hidden md:block"></div>

  <!-- ════════════════════════════════════════════
       MOBILE LAYOUT  (visible < md) — loaded from about/mobile.html
  ════════════════════════════════════════════ -->
  <main id="about-mobile-content" class="md:hidden pt-[64px] pb-16">
  </main>

  <!-- ══ MOBILE BOTTOM NAV (injected, md:hidden) ══ -->
  <div id="mob-nav"></div>

  <!-- ════════════════════════════════════════════
       DESKTOP LAYOUT  (visible md +) — loaded from about/desktop.html
  ════════════════════════════════════════════ -->
  <div id="about-desktop-content"></div>

  <!-- Desktop shared footer -->
  <div id="site-footer" class="hidden md:block"></div>

  <script src="../assets/js/script.js"></script>
  <script>
    (async () => {
      // Load the About page's desktop/mobile content partials from the
      // shared desktop/ and mobile/ folders so each layout can be edited
      // independently without touching the other.
      await Promise.all([
        loadComponent('#about-mobile-content', rootPath() + 'mobile/about.html'),
        loadComponent('#about-desktop-content', rootPath() + 'desktop/about.html'),
      ]);

      // Scroll reveal
      const abtObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            abtObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.abt-reveal').forEach(el => abtObserver.observe(el));
    })();

    // Mobile header scroll effect
    window.addEventListener('scroll', () => {
      const mobileHeader = document.querySelector('header.md\\:hidden');
      if (mobileHeader) {
        mobileHeader.classList.toggle('shadow-md', window.scrollY > 20);
      }
    });
  </script>
</body>
</html>
