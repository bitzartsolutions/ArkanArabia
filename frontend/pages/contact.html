  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Glass card */
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 40px 40px -20px rgba(27, 74, 159, 0.04);
    }
    /* Desktop glass */
    .glass {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
    }
    /* Gradient button */
    .btn-primary-gradient {
      background: linear-gradient(135deg, #00337d 0%, #1b4a9f 100%);
      transition: all 0.3s ease;
    }
    .btn-primary-gradient:active { transform: scale(0.95); }
    /* Bottom nav shadow */
    .nav-shadow { box-shadow: 0 -4px 40px rgba(27, 74, 159, 0.08); }
    /* Blue gradient */
    .blue-gradient { background: linear-gradient(135deg, #00337d 0%, #1b4a9f 100%); }
    /* Desktop contact reveal */
    .cnt-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .cnt-reveal.visible { opacity: 1; transform: translateY(0); }
    /* Mobile reveal */
    .mob-reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .mob-reveal.visible { opacity: 1; transform: translateY(0); }
    /* Side drawer */
    #cnt-drawer { transform: translateX(-100%); transition: transform 0.3s ease; }
    #cnt-drawer.open { transform: translateX(0); }
    #cnt-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #cnt-overlay.open { opacity: 1; pointer-events: auto; }
    /* FAQ */
    .faq-answer { display: none; margin-top: 16px; }
    .faq-item.open .faq-answer { display: block; }
    .faq-item.open .faq-icon { transform: rotate(180deg); }
    .faq-icon { transition: transform 0.3s ease; }
    /* Pulse pin */
    @keyframes ping { 75%,100%{transform:scale(2);opacity:0} }
    .animate-ping { animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite; }
    /* No scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">

  <!-- ══ MOBILE HEADER + DRAWER (injected, md:hidden) ══ -->
  <div id="mob-header"></div>

  <!-- ══════════════════════════════════════════════════════
       MOBILE MAIN CONTENT (< md only)
       ══════════════════════════════════════════════════════ -->
  <div id="contact-mobile-content"></div>
  <!-- END MOBILE MAIN -->

  <!-- ══ MOBILE BOTTOM NAV (injected, md:hidden) ══ -->
  <div id="mob-nav"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SHARED HEADER (injected, md+ only)
       ══════════════════════════════════════════════════════ -->
  <div id="site-header" class="hidden md:block"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SECTIONS (md+ only) — loaded from desktop/contact.html
       ══════════════════════════════════════════════════════ -->
  <div id="contact-desktop-content"></div>

  <!-- DESKTOP SHARED FOOTER (injected) -->
  <div id="site-footer" class="hidden md:block"></div>

  <!-- Scripts -->
  <script src="../assets/js/runtime-config.js"></script>
  <script src="../assets/js/script.js"></script>
  <script>
    function resolveApiBaseUrl() {
      const configured = String(window.ARKAN_API_BASE_URL || '').trim().replace(/\/+$/, '');
      if (configured) return configured;

      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') {
        return `${window.location.protocol}//${host}:4000`;
      }

      return window.location.origin;
    }

    async function submitInquiry(form) {
      const fields = form.querySelectorAll('input, select, textarea');
      const [nameField, companyField, emailField, phoneField, countryField, serviceField, messageField] = fields;

      const payload = {
        fullName: nameField?.value.trim() || '',
        company: companyField?.value.trim() || '',
        email: emailField?.value.trim() || '',
        phone: phoneField?.value.trim() || '',
        country: countryField?.value.trim() || '',
        service: serviceField?.value.trim() || '',
        message: messageField?.value.trim() || ''
      };

      const submitButton = form.querySelector('button[type="submit"]');
      const originalButtonText = submitButton ? submitButton.textContent : '';
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = 'Sending...';
      }

      try {
        const response = await fetch(`${resolveApiBaseUrl()}/api/inquiries`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.error || 'Failed to send inquiry.');
        }

        form.reset();
        alert('Inquiry sent successfully to info@arkanarabialogistics.com.');
      } catch (error) {
        alert(error.message || 'Failed to send inquiry. Please try again.');
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText || 'Send Inquiry';
        }
      }
    }

    (async () => {
      // Load the Contact page's desktop/mobile content partials from the
      // shared desktop/ and mobile/ folders so each layout can be edited
      // independently without touching the other.
      await Promise.all([
        loadComponent('#contact-mobile-content', rootPath() + 'mobile/contact.html'),
        loadComponent('#contact-desktop-content', rootPath() + 'desktop/contact.html'),
      ]);

      // The browser tries to scroll to the URL's #hash (e.g. arriving from
      // the header's "Get Quote" link) before this content exists, so its
      // native anchor-scroll silently does nothing. Do it manually now that
      // the target element is actually in the DOM. Use an instant jump (the
      // page has scroll-smooth enabled, and an animated scroll started this
      // early gets interrupted/frozen partway by images/fonts still
      // settling), then re-apply shortly after in case that late layout
      // shift moved the target.
      if (location.hash) {
        const scrollToHash = () => {
          const target = document.querySelector(location.hash);
          if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
        };
        scrollToHash();
        setTimeout(scrollToHash, 300);
      }

      // ── Mobile scroll-reveal ──
      const mobObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); mobObs.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.mob-reveal').forEach(el => mobObs.observe(el));

      // ── Desktop cnt-reveal ──
      const cntObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); cntObs.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.cnt-reveal').forEach(el => cntObs.observe(el));

      // ── Desktop FAQ ──
      document.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-trigger').addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
          if (!isOpen) item.classList.add('open');
        });
      });

      // ── Mobile form label focus ──
      document.querySelectorAll('#mob-inquiry-form input, #mob-inquiry-form select, #mob-inquiry-form textarea').forEach(el => {
        el.addEventListener('focus', () => {
          const label = el.closest('div').querySelector('label');
          if (label) label.style.color = '#00337d';
        });
        el.addEventListener('blur', () => {
          const label = el.closest('div').querySelector('label');
          if (label) label.style.color = '#434652';
        });
      });

      ['mob-inquiry-form', 'desktop-inquiry-form'].forEach((formId) => {
        const form = document.getElementById(formId);
        if (!form) return;

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          submitInquiry(form);
        });
      });
    })();
  </script>
</body>
</html>
