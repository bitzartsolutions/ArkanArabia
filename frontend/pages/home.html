            "secondary-fixed": "#dee0ff",
            "secondary": "#4957ad",
            "secondary-container": "#94a2fe",
            "surface": "#fcf9f8",

            "tertiary-fixed-dim": "#c0c7cf",

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/styles.css">

  <style>
    /* Glass morphism */
    .glass-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
    }
    /* Hide scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    /* Specialized Industry Solutions grid: 3 cards per row on desktop */
    .industry-card { width: 100%; }
    @media (min-width: 768px) {
      .industry-card { width: calc((100% - 48px) / 3); }
    }
    /* Comprehensive Service Suite grid: 3 cards per row on desktop (gap-md = 16px here) */
    .core-service-card { width: 100%; }
    @media (min-width: 768px) {
      .core-service-card { width: calc((100% - 32px) / 3); }
    }
    /* Fade-in reveal */
    .mob-reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .mob-reveal.visible { opacity: 1; transform: translateY(0); }
    /* Side drawer transition */
    #mobile-drawer { transform: translateX(-100%); transition: transform 0.3s ease; }
    #mobile-drawer.open { transform: translateX(0); }
    #drawer-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #drawer-overlay.open { opacity: 1; pointer-events: auto; }
    /* Logo scroll */
    .logo-scroll { animation: scrollX 28s linear infinite; display: flex; width: max-content; }
    @keyframes scrollX { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    /* No scrollbar utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Mobile process timeline line */
    .mob-timeline { position: relative; }
    .mob-timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(0,51,125,0.15);
    }
  </style>
</head>

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">

  <!-- ══ MOBILE HEADER + DRAWER (injected, md:hidden) ══ -->
  <div id="mob-header"></div>

  <!-- ══════════════════════════════════════════════════════
       MOBILE MAIN CONTENT (< md only)
       ══════════════════════════════════════════════════════ -->
  <main id="home-mobile-content" class="md:hidden pt-[64px] pb-16"></main>
  <!-- END MOBILE MAIN -->

  <!-- ══ MOBILE BOTTOM NAV (injected, md:hidden) ══ -->
  <div id="mob-nav"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SHARED HEADER (injected, md+ only)
       ══════════════════════════════════════════════════════ -->
  <div id="site-header" class="hidden md:block"></div>

  <!-- ══════════════════════════════════════════════════════
       DESKTOP SECTIONS (md+ only) — loaded from desktop/home.html
       ══════════════════════════════════════════════════════ -->
  <div id="home-desktop-content"></div>

  <!-- DESKTOP SHARED FOOTER (injected) -->
  <div id="site-footer" class="hidden md:block"></div>

  <!-- ══ Scripts ══ -->
  <script src="../assets/js/script.js"></script>
  <script>
    (async () => {
      // Load the Home page's desktop/mobile content partials from the
      // shared desktop/ and mobile/ folders so each layout can be edited
      // independently without touching the other.
      await Promise.all([
        loadComponent('#home-mobile-content', rootPath() + 'mobile/home.html'),
        loadComponent('#home-desktop-content', rootPath() + 'desktop/home.html'),
      ]);

      // ── Mobile scroll-reveal ──
      const mobObserver = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); mobObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.mob-reveal').forEach(el => mobObserver.observe(el));

      // Desktop content uses the shared .reveal/.counter scroll effects from
      // script.js. Its own DOMContentLoaded handler may run initReveal()/
      // initCounters() before this fetch resolves, so re-run them here to
      // make sure the freshly-injected desktop elements get observed too.
      if (typeof initReveal === 'function') initReveal();
      if (typeof initCounters === 'function') initCounters();
    })();
  </script>
</body>
</html>
