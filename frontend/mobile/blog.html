<main class="md:hidden pt-[64px] pb-16">

    <!-- Mobile Hero -->
    <section class="relative overflow-hidden" style="background: linear-gradient(160deg, #00337d 0%, #1b4a9f 60%, #0d4297 100%);">
      <div class="blog-hero-dots absolute inset-0 z-0"></div>
      <div class="relative z-10 px-md pt-xl pb-lg space-y-md">
        <span class="inline-block px-sm py-1 bg-white/15 backdrop-blur-md border border-white/20 text-white font-label-sm text-label-sm rounded-full tracking-widest">INSIGHTS & NEWS</span>
        <h1 class="font-h1 text-[38px] leading-tight text-white">Arkan Arabia Blog</h1>
        <p class="font-body-lg text-body-lg text-primary-fixed-dim max-w-sm">Industry insights, logistics trends and company news from a leading global freight forwarder.</p>
        <!-- Mobile Search -->
        <div class="relative mt-md">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
          <input id="mob-search" type="text" placeholder="Search articles..." autocomplete="off"
            class="blog-search w-full h-12 pl-11 pr-4 bg-white rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant border-0 shadow-lg"/>
        </div>
      </div>
    </section>

    <!-- Mobile: Category filter pills -->
    <section class="px-md pt-md pb-sm overflow-x-auto">
      <div id="mob-filter-pills" class="flex gap-sm w-max">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Mobile: Post grid -->
    <section class="px-md pt-sm pb-md">
      <!-- Admin: New Post button injected here by JS -->
      <div id="mob-admin-btn-area" class="mb-md"></div>
      <div id="mob-post-grid" class="space-y-md">
        <!-- Injected by JS -->
      </div>
      <p id="mob-no-results" class="hidden text-center text-on-surface-variant py-xl font-body-md text-body-md">No posts found.</p>
    </section>

    <!-- Mobile: Featured post / Categories / Recent posts (same content as desktop sidebar) -->
    <section class="px-md pb-md space-y-md">

      <!-- Featured post -->
      <div id="mob-featured" class="bg-surface-container-low rounded-2xl overflow-hidden shadow-sm border border-outline-variant/20">
        <!-- Injected by JS -->
      </div>

      <!-- Categories -->
      <div class="bg-surface-container-low rounded-2xl p-md border border-outline-variant/20 shadow-sm">
        <h3 class="font-h3 text-[18px] font-semibold text-on-surface mb-md border-b border-outline-variant/30 pb-sm">Categories</h3>
        <ul id="mob-categories" class="space-y-xs">
          <!-- Injected by JS -->
        </ul>
      </div>

      <!-- Recent posts -->
      <div class="bg-surface-container-low rounded-2xl p-md border border-outline-variant/20 shadow-sm">
        <h3 class="font-h3 text-[18px] font-semibold text-on-surface mb-md border-b border-outline-variant/30 pb-sm">Recent Posts</h3>
        <ul id="mob-recent-posts" class="space-y-md">
          <!-- Injected by JS -->
        </ul>
      </div>

    </section>

    <!-- Mobile Footer (atomic component) -->
    <div id="mob-footer"></div>
</main>
