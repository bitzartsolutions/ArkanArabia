<main class="md:hidden pt-[64px] pb-16">

    <!-- Mobile Hero -->
    <section class="relative overflow-hidden" style="background: linear-gradient(160deg, #00337d 0%, #1b4a9f 60%, #0d4297 100%);">
      <div class="blog-hero-dots absolute inset-0 z-0"></div>
      <div class="relative z-10 px-md pt-xl pb-lg space-y-md">
        <span class="inline-block px-sm py-1 bg-white/15 backdrop-blur-md border border-white/20 text-white font-label-sm text-label-sm rounded-full tracking-widest">CAREERS</span>
        <h1 class="font-h1 text-[38px] leading-tight text-white">Join Our Team</h1>
        <p class="font-body-lg text-body-lg text-primary-fixed-dim max-w-sm">Help us build the future of logistics across the region. Explore our open roles below.</p>
      </div>
    </section>

    <!-- Mobile: Job listing -->
    <section class="px-md pt-lg pb-md">
      <div class="mb-md">
        <span class="text-xs font-semibold text-primary uppercase tracking-widest block mb-1">Open Positions</span>
        <h2 class="font-h2 text-h2 text-on-surface">Current Openings</h2>
      </div>
      <div id="mob-job-grid" class="space-y-md">
        <!-- Injected by JS -->
      </div>
      <p id="mob-job-empty" class="hidden text-center text-on-surface-variant py-xl font-body-md text-body-md">No open positions right now — check back soon.</p>
    </section>

    <!-- Mobile Footer (atomic component) -->
    <div id="mob-footer"></div>
</main>
